<script>
const DATA = /*__DATA__*/;
const IMG = /*__IMAGES__*/;
const { PROPERTIES, DESTINATIONS, AMENITIES, AMENITY_GROUPS } = DATA;
const AMENITY_LABEL = Object.fromEntries(AMENITIES.map(a => [a.key, a.label]));
const FILTER_AMENITIES = AMENITIES.filter(a => a.filter);
const img = (src) => IMG[src] || src;

/* ── Opmaak ─────────────────────────────────────────────────────── */
const euro = (n, cents) => new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }).format(n);
const iso = (d) => d.toISOString().slice(0, 10);
const addDays = (isoDate, days) => { const d = new Date(isoDate + "T12:00:00"); d.setDate(d.getDate() + days); return iso(d); };
const nights = (a, b) => Math.max(0, Math.round((+new Date(b) - +new Date(a)) / 86400000));
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ── MyTourist-mock ──────────────────────────────────────────────────
   Exact dezelfde berekening als in src/lib/wadweids/mytourist.ts: dezelfde
   seizoensfactoren, minimumverblijf en aankomstdagen. */
function hash(seed) { let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }
function seasonFactor(d) { const m = d.getMonth(); if (m === 6 || m === 7) return 1.32; if (m === 4 || m === 5 || m === 8) return 1.14; if (m === 3 || m === 9) return 1.0; return 0.86; }
function weekendFactor(d) { const k = d.getDay(); return k === 5 || k === 6 ? 1.18 : 1; }
function dayFor(p, date) {
  const d = new Date(date + "T12:00:00"), h = hash(p.id + date);
  const rate = Math.round((p.priceFrom * seasonFactor(d) * weekendFactor(d)) / 5) * 5;
  return { date, rate, available: h > (seasonFactor(d) > 1.2 ? 0.42 : 0.2), arrivalAllowed: seasonFactor(d) > 1.2 ? [5, 1].includes(d.getDay()) : true, minNights: seasonFactor(d) > 1.2 ? Math.max(p.minNights, 3) : p.minNights };
}
function quoteFor(p, { arrival, departure, guests, extras = [] }) {
  const n = nights(arrival, departure), g = Math.min(Math.max(1, guests), p.guests), lines = [];
  const days = Array.from({ length: n }, (_, i) => dayFor(p, addDays(arrival, i)));
  const stay = days.reduce((s, d) => s + d.rate, 0);
  const averageRate = n ? Math.round(stay / n) : p.priceFrom;
  let available = n > 0 && days.every(d => d.available), reason;
  if (n === 0) { available = false; reason = "Kies een aankomst- en vertrekdatum."; }
  else if (!days.every(d => d.available)) reason = "Deze periode is deels bezet. Bekijk de kalender voor vrije data.";
  else if (n < (days[0] ? days[0].minNights : p.minNights)) { available = false; reason = "In deze periode geldt een minimum van " + (days[0] ? days[0].minNights : p.minNights) + " nachten."; }
  else if (days[0] && !days[0].arrivalAllowed) { available = false; reason = "In het hoogseizoen kun je aankomen op maandag of vrijdag."; }
  if (n > 0) lines.push({ label: euro(averageRate) + " × " + plural(n, "nacht", "nachten"), detail: "Dynamisch tarief per nacht", amount: stay });
  if (n >= 7) lines.push({ label: "Weekkorting", detail: "10% vanaf zeven nachten", amount: -Math.round(stay * 0.1) });
  lines.push({ label: "Eindschoonmaak", amount: p.cleaningFee });
  lines.push({ label: "Toeristenbelasting", detail: g + " × " + n + " × " + euro(p.touristTaxPerPersonPerNight, true), amount: Math.round(p.touristTaxPerPersonPerNight * g * n * 100) / 100, cents: true });
  for (const key of extras) {
    const e = p.extras.find(x => x.key === key); if (!e) continue;
    lines.push({ label: e.label, detail: e.unit === "night" ? "per nacht" : e.unit === "person" ? "per persoon" : "eenmalig", amount: e.unit === "night" ? e.price * n : e.unit === "person" ? e.price * g : e.price });
  }
  const total = Math.round(lines.reduce((s, l) => s + l.amount, 0) * 100) / 100;
  return { nights: n, guests: g, averageRate, lines, total, deposit: Math.round(total * 0.3), available, reason };
}
/* Eerstvolgende echt boekbare periode — zie firstBookableStay() in de app. */
function firstBookableStay(p, from, n) {
  for (let o = 0; o < 180; o++) {
    const arrival = addDays(from, o);
    const days = Array.from({ length: n }, (_, i) => dayFor(p, addDays(arrival, i)));
    if (days.every(d => d.available) && days[0].arrivalAllowed && n >= days[0].minNights) return { arrival, departure: addDays(arrival, n) };
  }
  return { arrival: from, departure: addDays(from, n) };
}
function calendarMonth(p, y, m) {
  const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return Array.from({ length: days }, (_, i) => dayFor(p, iso(new Date(Date.UTC(y, m, i + 1)))));
}
function searchProperties(filters) {
  let list = PROPERTIES.filter(p => {
    if (filters.destination && p.destination !== filters.destination) return false;
    if (filters.guests && p.guests < filters.guests) return false;
    if (filters.bedrooms && p.bedrooms < filters.bedrooms) return false;
    if (filters.maxPrice && p.priceFrom > filters.maxPrice) return false;
    if (filters.amenities && filters.amenities.length && !filters.amenities.every(a => p.amenities.includes(a))) return false;
    return true;
  });
  if (filters.arrival && filters.departure) {
    const n = nights(filters.arrival, filters.departure);
    list = list.filter(p => Array.from({ length: n }, (_, i) => dayFor(p, addDays(filters.arrival, i))).every(d => d.available));
  }
  const s = [...list];
  if (filters.sort === "prijs-op") s.sort((a, b) => a.priceFrom - b.priceFrom);
  if (filters.sort === "prijs-af") s.sort((a, b) => b.priceFrom - a.priceFrom);
  if (filters.sort === "personen") s.sort((a, b) => b.guests - a.guests);
  return s;
}
const countFilters = (f) => (f.destination ? 1 : 0) + (f.guests ? 1 : 0) + (f.bedrooms ? 1 : 0) + (f.maxPrice ? 1 : 0) + (f.arrival && f.departure ? 1 : 0) + ((f.amenities || []).length);

  guests: (s = 16) => svg('<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.6-3.1 3-4.8 6-4.8s5.4 1.7 6 4.8"/><path d="M16 6.2a3.2 3.2 0 0 1 0 6.1M18 14.6c2.1.6 3.4 2.2 3.8 4.4"/>', s),
  bed: (s = 16) => svg('<path d="M3 18v-8m0 4h18v4M3 12V8a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v4M21 14v-2a2 2 0 0 0-2-2h-7"/>', s),
  bath: (s = 16) => svg('<path d="M3 12h18v2a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-2ZM6 12V6.5A2.5 2.5 0 0 1 8.5 4c1 0 1.8.6 2.2 1.4M6 18l-1 2M18 18l1 2"/>', s),
  area: (s = 16) => svg('<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 3.5v3M3.5 8h3M16 20.5v-3M20.5 16h-3"/>', s),
  pin: (s = 14) => svg('<path d="M12 21s6.5-6.1 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/>', s),
  heart: (s = 17, filled) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 7.8a4.1 4.1 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20Z"/></svg>',
  arrow: (s = 15) => svg('<path d="M4 12h15m-5.5-5.5L19 12l-5.5 5.5"/>', s),
  check: (s = 15) => svg('<path d="m4.5 12.5 4.5 4.5L19.5 6.5"/>', s),
  chevron: (s = 14) => svg('<path d="m6 9.5 6 6 6-6"/>', s),
  sliders: (s = 17) => svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>', s),
  menu: (s = 18) => svg('<path d="M4 8h16M4 16h16"/>', s),
  close: (s = 18) => svg('<path d="M6 6l12 12M18 6 6 18"/>', s),
  space: (s = 30) => svg('<path d="M2 15h20M2 19h20M6 11h12M9 7h6"/>', s),
  nature: (s = 30) => svg('<path d="M12 21V9M12 9c0-3 2-5 5-5 0 3-2 5-5 5ZM12 12c0-3-2-5-5-5 0 3 2 5 5 5ZM4 21h16"/>', s),
  comfort: (s = 30) => svg('<path d="M4 18v-6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6M4 15h16M7 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M6 18v2M18 18v2"/>', s),
  personal: (s = 30) => svg('<path d="M12 20.5s-7-4.2-7-9.2A3.9 3.9 0 0 1 12 8.6a3.9 3.9 0 0 1 7 2.7c0 5-7 9.2-7 9.2ZM12 3v2.5"/>', s),
  tide: (s = 30) => svg('<path d="M2 9c2.5-2 5-2 7.5 0S15 11 17.5 9 22 7 22 7M2 15c2.5-2 5-2 7.5 0s5 2 7.5 0 4.5-2 4.5-2"/>', s),
};
const LOGO_MARK = (size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 40 40" fill="none" aria-hidden="true">' +

  '<path d="M8 18.4h24" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>' +

  '<path d="M8 29.2h24" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-opacity=".4"/>' +

const footer = () => '<footer class="ww-footer" id="contact"><div class="ww-wrap">' +

function bookingWidget(p) {
  const b = booking, q = quoteFor(p, b);

    return '<div class="ww-booking"><span class="ww-booking__status"><span class="ww-dot"></span> Optie vastgelegd</span>' +
      '<h3 class="ww-h3 ww-mt-s">Bedankt — we houden ' + esc(p.name) + ' voor je vast.</h3>' +
      '<p class="ww-body ww-mt-s" style="font-size:.92rem">Reserveringsnummer <strong>' + b.bevestiging + '</strong>. Je ontvangt binnen enkele minuten een bevestiging met een betaallink voor de aanbetaling van ' + euro(q.deposit) + '.</p>' +
      '<div class="ww-booking__lines ww-mt-m"><div class="ww-booking__line"><span>Aankomst</span><span>' + b.arrival + '</span></div>' +
      '<div class="ww-booking__line"><span>Vertrek</span><span>' + b.departure + '</span></div>' +
      '<div class="ww-booking__line"><span>Gasten</span><span>' + q.guests + '</span></div></div>' +
      '<div class="ww-booking__total"><span>Totaal</span><strong>' + euro(q.total, true) + '</strong></div>' +
      '<button class="ww-btn ww-btn--ghost ww-btn--block ww-mt-m" data-bk="terug">Terug naar de kalender</button>' +
      '<p class="ww-booking__note">In de echte site legt MyTourist deze optie vast en verstuurt hij de bevestiging.</p></div>';
  }
  const dagen = calendarMonth(p, b.maand.y, b.maand.m);
  const offset = (new Date(dagen[0].date + "T12:00:00").getDay() + 6) % 7;
  return '<div class="ww-booking">' +
    '<div class="ww-booking__price"><span class="ww-price">' + euro(q.averageRate) + ' <small>gemiddeld per nacht</small></span>' +
    '<span class="ww-booking__status"><span class="ww-dot' + (q.available ? "" : " ww-dot--busy") + '"></span>' + (q.available ? "Beschikbaar" : "Bezet") + '</span></div>' +
    '<div class="ww-booking__dates">' +
      '<div class="ww-field"><label for="bk-arr">Aankomst</label><input id="bk-arr" type="date" data-bk="arrival" value="' + b.arrival + '"></div>' +
      '<div class="ww-field"><label for="bk-dep">Vertrek</label><input id="bk-dep" type="date" data-bk="departure" value="' + b.departure + '"></div></div>' +
    '<div class="ww-booking__guests"><div class="ww-field"><label for="bk-guests">Gasten</label><select id="bk-guests" data-bk="guests">' +
      Array.from({ length: p.guests }, (_, i) => i + 1).map(n => '<option value="' + n + '"' + (b.guests === n ? " selected" : "") + '>' + plural(n, "gast", "gasten") + '</option>').join("") +
    '</select><span class="ww-field__caret">' + ICON.chevron() + '</span></div></div>' +
    (p.extras.length ? '<div class="ww-mt-m"><h4 style="font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px">Extra\'s</h4>' +
      p.extras.map(e => '<label class="ww-extra"><input type="checkbox" class="ww-checkbox" style="margin-top:3px" data-extra="' + e.key + '"' + (b.extras.includes(e.key) ? " checked" : "") + '>' +
        '<span>' + esc(e.label) + '<span style="display:block;color:var(--ink-soft);font-size:.82rem">' + esc(e.description) + '</span></span>' +
        '<span class="ww-extra__price">' + (e.price === 0 ? "gratis" : euro(e.price) + (e.unit === "night" ? " p.n." : e.unit === "person" ? " p.p." : "")) + '</span></label>').join("") + '</div>' : "") +
    '<div class="ww-booking__lines">' + q.lines.map(l =>
      '<div class="ww-booking__line"><span>' + esc(l.label) + (l.detail ? '<em style="font-style:normal;opacity:.6;font-size:.8rem"> · ' + esc(l.detail) + '</em>' : "") + '</span>' +
      '<span>' + euro(l.amount, !!l.cents) + '</span></div>').join("") + '</div>' +
    '<div class="ww-booking__total"><span>Totaal' + (q.nights ? " · " + plural(q.nights, "nacht", "nachten") : "") + '</span><strong>' + euro(q.total, true) + '</strong></div>' +
    '<button class="ww-btn ww-btn--primary ww-btn--block ww-btn--lg ww-mt-m" data-bk="boek"' + (q.available ? "" : ' style="opacity:.45;cursor:not-allowed" disabled') + '>Boek nu ' + ICON.arrow(14) + '</button>' +
    '<p class="ww-booking__note">' + (q.available ? "Aanbetaling " + euro(q.deposit) + " · rest 30 dagen voor aankomst · gratis annuleren tot 60 dagen vooraf" : esc(q.reason || "")) + '</p>' +
    '<div class="ww-mt-l"><div class="ww-row" style="justify-content:space-between;margin-bottom:14px">' +
      '<button data-bk="vorige" aria-label="Vorige maand" style="transform:rotate(90deg)">' + ICON.chevron() + '</button>' +
      '<strong style="font-family:var(--serif);font-size:1.15rem;font-weight:500">' + new Date(b.maand.y, b.maand.m, 1).toLocaleDateString("nl-NL", { month: "long", year: "numeric" }) + '</strong>' +
      '<button data-bk="volgende" aria-label="Volgende maand" style="transform:rotate(-90deg)">' + ICON.chevron() + '</button></div>' +
      '<div class="ww-cal">' + ["ma", "di", "wo", "do", "vr", "za", "zo"].map(d => '<span class="ww-cal__dow">' + d + '</span>').join("") +
      Array.from({ length: offset }, () => '<span class="ww-cal__day ww-cal__day--out"></span>').join("") +
      dagen.map(d => {
        const sel = d.date >= b.arrival && d.date < b.departure;
        const cls = sel ? "ww-cal__day ww-cal__day--sel" : d.available ? "ww-cal__day" : "ww-cal__day ww-cal__day--busy";
        return '<button class="' + cls + '" data-day="' + d.date + '"' + (d.available ? "" : " disabled") + ' title="' + d.date + (d.available ? " · " + euro(d.rate) : " · bezet") + '">' + Number(d.date.slice(-2)) + '</button>';
      }).join("") + '</div>' +
      '<div class="ww-cal__legend"><span><i class="ww-swatch"></i> beschikbaar</span><span><i class="ww-swatch ww-swatch--busy"></i> bezet</span><span>' + ICON.check(13) + ' live uit MyTourist</span></div>' +
    '</div></div>';
}

    const d = new Date(stay.arrival + "T12:00:00");
    booking = { slug: p.slug, arrival: stay.arrival, departure: stay.departure, guests: Math.min(2, p.guests), extras: [], maand: { y: d.getFullYear(), m: d.getMonth() }, bevestiging: null };
  }
  const dest = DESTINATIONS.find(d => d.slug === p.destination);

  '<section class="ww-section ww-section--tight"><div class="ww-wrap"><div class="ww-detail"><div>' +
    '<div class="ww-facts">' +
      '<span class="ww-fact">' + ICON.guests() + ' <strong>' + p.guests + '</strong> gasten</span>' +
      '<span class="ww-fact">' + ICON.bed() + ' <strong>' + p.bedrooms + '</strong> slaapkamers</span>' +
      '<span class="ww-fact">' + ICON.bath() + ' <strong>' + p.bathrooms + '</strong> badkamers</span>' +

    '<div class="ww-block"><h3 class="ww-h3">Wat dit huis bijzonder maakt</h3><ul class="ww-highlights">' +

/* ── Router en interactie ───────────────────────────────────────── */
const app = document.getElementById("app");
const stage = document.getElementById("stage");
const TABS = [["Homepage", "#/"], ["Zoekresultaten", "#/verblijven"], ["Accommodatie", "#/verblijf/de-weidsheid"], ["Bestemmingen", "#/bestemmingen"], ["Merk & systeem", "#/merk"]];

function route() {
  const h = (location.hash || "#/").replace(/^#/, "");
  const [, one, two] = h.split("/");
  if (one === "verblijven") return screenResults();
  if (one === "verblijf") return screenDetail(two);
  if (one === "bestemmingen") return screenDestinations();
  if (one === "bestemming") return screenDestination(two);
  if (one === "merk") return screenMerk();
  return screenHome();
}

function paintTabs() {
  const h = location.hash || "#/";
  document.getElementById("tabs").innerHTML = TABS.map(([l, href]) =>
    '<a class="proto__tab" href="' + href + '" aria-current="' + (h === href || (href !== "#/" && h.startsWith(href.slice(0, 12))) ? "true" : "false") + '">' + l + '</a>').join("");
}

function render(keepScroll) {
  const y = keepScroll ? app.scrollTop || window.scrollY : 0;
  app.innerHTML = route();
  paintTabs();
  if (keepScroll) { if (app.scrollHeight > app.clientHeight + 20 && stage.classList.contains("proto__stage--mobile")) app.scrollTop = y; else window.scrollTo(0, y); }
  else { app.scrollTop = 0; window.scrollTo(0, 0); }
}

window.addEventListener("hashchange", () => render(false));

/* Compacte header bij scrollen — op de pagina én in het telefoonframe. */
const onScroll = (y) => { const h = document.getElementById("hdr"); if (h) h.classList.toggle("is-compact", y > 40); };
window.addEventListener("scroll", () => onScroll(window.scrollY), { passive: true });
app.addEventListener("scroll", () => onScroll(app.scrollTop), { passive: true });

/* Desktop / mobiel */
document.getElementById("device").addEventListener("click", (e) => {
  const mobile = stage.classList.toggle("proto__stage--mobile");
  e.target.textContent = mobile ? "Desktop" : "Mobiel";
  e.target.setAttribute("aria-current", mobile ? "true" : "false");
  app.scrollTop = 0;
});

/* Eén klikafhandelaar voor de hele mock-up. */
document.addEventListener("click", (e) => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.preventDefault();
    const id = fav.dataset.fav, list = favs();
    const next = list.includes(id) ? list.filter(x => x !== id) : list.concat(id);
    try { localStorage.setItem("ww-favorieten", JSON.stringify(next)); } catch (err) {}
    document.querySelectorAll('[data-fav="' + id + '"]').forEach(b => {
      const on = next.includes(id);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.innerHTML = ICON.heart(17, on);
    });
    return;
  }
  const am = e.target.closest("[data-am]");
  if (am) { const k = am.dataset.am; filters.amenities = filters.amenities.includes(k) ? filters.amenities.filter(x => x !== k) : filters.amenities.concat(k); zichtbaar = 9; return render(true); }
  if (e.target.closest("[data-clear]")) { filters = { sort: filters.sort, amenities: [] }; zichtbaar = 9; return render(true); }
  if (e.target.closest("[data-more]")) { zichtbaar += 9; return render(true); }
  if (e.target.closest('[data-sheet="open"]')) return openSheet();
  if (e.target.closest('[data-menu="open"]')) return openMenu();

  const bk = e.target.closest("[data-bk]");
  if (bk && booking) {
    const p = PROPERTIES.find(x => x.slug === booking.slug);
    const act = bk.dataset.bk;
    if (act === "boek") { booking.bevestiging = "WW-2026-" + p.id.slice(-4); return render(true); }
    if (act === "terug") { booking.bevestiging = null; return render(true); }
    if (act === "vorige") { booking.maand = booking.maand.m === 0 ? { y: booking.maand.y - 1, m: 11 } : { y: booking.maand.y, m: booking.maand.m - 1 }; return render(true); }
    if (act === "volgende") { booking.maand = booking.maand.m === 11 ? { y: booking.maand.y + 1, m: 0 } : { y: booking.maand.y, m: booking.maand.m + 1 }; return render(true); }
  }
  const day = e.target.closest("[data-day]");
  if (day && booking) {
    const d = day.dataset.day;
    if (!booking.pendingArrival && d > booking.arrival) { booking.departure = d; }
    else { booking.arrival = d; booking.departure = addDays(d, 3); }
    return render(true);
  }
});

document.addEventListener("change", (e) => {
  const f = e.target.dataset.f;
  if (f) {
    const v = e.target.value;
    if (f === "guests" || f === "bedrooms") filters[f] = v ? Number(v) : undefined;
    else if (f === "maxPrice") filters.maxPrice = Number(v) >= 600 ? undefined : Number(v);
    else filters[f] = v || undefined;
    zichtbaar = 9;
    return render(true);
  }
  const bk = e.target.dataset.bk;
  if (bk && booking) {
    if (bk === "arrival") { booking.arrival = e.target.value; if (booking.departure <= booking.arrival) booking.departure = addDays(booking.arrival, 3); const d = new Date(booking.arrival + "T12:00:00"); booking.maand = { y: d.getFullYear(), m: d.getMonth() }; }
    if (bk === "departure") booking.departure = e.target.value;
    if (bk === "guests") booking.guests = Number(e.target.value);
    return render(true);
  }
  const ex = e.target.dataset.extra;
  if (ex && booking) {
    booking.extras = booking.extras.includes(ex) ? booking.extras.filter(x => x !== ex) : booking.extras.concat(ex);
    return render(true);
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "searchform") return;
  e.preventDefault();
  const g = (id) => document.getElementById(id) ? document.getElementById(id).value : "";
  filters = { ...filters, destination: g("s-dest") || undefined, arrival: g("s-arr") || undefined, departure: g("s-dep") || undefined, guests: g("s-guests") ? Number(g("s-guests")) : undefined };
  zichtbaar = 9;
  if (location.hash === "#/verblijven") render(false); else location.hash = "#/verblijven";
});

/* Filtersheet en menu op mobiel */
function openSheet() {
  const el = document.createElement("div");
  el.className = "ww-sheet";
  el.innerHTML = '<div class="ww-sheet__scrim" data-dismiss="1"></div><div class="ww-sheet__panel">' +
    '<div class="ww-sheet__head"><h3 class="ww-h4">Filters</h3><button data-dismiss="1" aria-label="Filters sluiten">' + ICON.close() + '</button></div>' +
    '<div class="ww-sheet__body">' + filterPanel() + '</div>' +
    '<div class="ww-sheet__foot"><button class="ww-btn ww-btn--ghost" data-clear="1">Wissen</button>' +
    '<button class="ww-btn ww-btn--primary" data-dismiss="1">Toon ' + searchProperties(filters).length + ' verblijven</button></div></div>';
  el.addEventListener("click", (ev) => { if (ev.target.closest("[data-dismiss]")) el.remove(); });
  app.appendChild(el);
}
function openMenu() {
  const el = document.createElement("div");
  el.className = "ww-menu";
  el.innerHTML = '<div class="ww-menu__top">' + logo() + '<button data-dismiss="1" aria-label="Menu sluiten">' + ICON.close(22) + '</button></div>' +
    '<nav>' + NAV.map(([l, h]) => '<a href="' + h + '" data-dismiss="1">' + esc(l) + '</a>').join("") + '</nav>' +
    '<div class="ww-menu__foot"><a href="#/verblijven" class="ww-btn ww-btn--primary ww-btn--block" data-dismiss="1">Bekijk verblijven</a>' +
    '<a href="#/#contact" class="ww-btn ww-btn--ghost ww-btn--block" data-dismiss="1">Mijn boeking</a></div>';
  el.addEventListener("click", (ev) => { if (ev.target.closest("[data-dismiss]")) el.remove(); });
  app.appendChild(el);
}

render(false);
</script>
